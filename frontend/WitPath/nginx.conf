# =============================================================================
# WitPath 前端 Nginx 配置（挂载为 /etc/nginx/conf.d/default.conf）
# 反代规则与 vite.config.ts 开发代理一致：/api、/login、/register、/public、
# /files 原样透传给后端；其余路径走 SPA（vue-router history 模式）。
#
# /login 与 /register 同时是前端路由和后端接口路径：
#   浏览器直达（GET 且 Accept 含 text/html）→ 交回 index.html 由 SPA 渲染；
#   axios 接口请求（Accept 为 JSON / POST）→ 转发给后端。
# =============================================================================

# 该文件被 include 进 http 块，map 可与 server 同文件声明
map "$request_method:$http_accept" $witpath_spa {
    "~^GET:.*text/html"  1;
    default              0;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 multipart 上限（20MB 文件 / 25MB 请求）对齐
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 用 Docker 内置 DNS 按需解析后端容器名：后端未启动时 Nginx 也能正常起，
    # 请求时再解析，避免启动顺序依赖
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $witpath_backend http://witpath-backend:8080;

    # ---------- 后端接口：路径原样透传 ----------
    location /api/ {
        proxy_pass $witpath_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /public/ {
        proxy_pass $witpath_backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /files/ {
        proxy_pass $witpath_backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /login、/register：浏览器导航交回 SPA，接口请求转发后端
    location ~ ^/(login|register) {
        if ($witpath_spa) {
            rewrite ^ /index.html last;
        }
        proxy_pass $witpath_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- SPA 静态资源与前端路由 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源带哈希指纹，可长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
